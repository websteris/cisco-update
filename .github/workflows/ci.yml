name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Perl dependencies
        run: sudo apt-get update && sudo apt-get install -y libnet-telnet-cisco-perl
      - name: Perl syntax check
        run: find . -name '*.pl' -print0 | xargs -0 -n1 perl -c
